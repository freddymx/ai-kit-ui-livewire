# Runs the test suite when a new version is released (not on every push).
#
# This package has a local path dependency on ai-kit-core (../ai-kit-core), so CI clones
# it as a sibling first. Once ai-kit-core is on Packagist, drop the clone step and
# let Composer resolve it normally.
name: tests

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pest:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']

    steps:
      - uses: actions/checkout@v4

      - name: Clone ai-kit-core (path dependency at ../ai-kit-core)
        run: git clone --depth=1 https://github.com/solutionforest/ai-kit-core.git ../ai-kit-core

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, sqlite3, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest
