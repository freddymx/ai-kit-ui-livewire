# Runs the test suite when a new version is released (not on every push).
#
# composer.json declares a local path repository for ai-kit-core (../ai-kit-core) so
# cross-package changes can be tested together; CI clones that sibling first. The
# package itself is published on Packagist as freddymx/ai-kit-ui-livewire.
name: tests

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pest:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']

    steps:
      - uses: actions/checkout@v4

      - name: Clone ai-kit-core (path dependency at ../ai-kit-core)
        run: git clone --depth=1 https://github.com/freddymx/ai-kit-core.git ../ai-kit-core

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, sqlite3, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest
